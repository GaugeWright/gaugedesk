<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GaugeDesk — TokenWright boxes lab</title>
    <style>
      /* Bench chrome only. Everything inside a stage is the product stylesheet;
         nothing here may style a product class, or the prototype would flatter
         itself and the agreed result would not survive the move into the app. */
      body { margin: 0; background: var(--bg, #0c1a2e); color: var(--ink, #e6ebf2);
             font-family: var(--ui), sans-serif; }
      .lab { max-width: 760px; margin: 0 auto; padding: 32px 24px 96px; }
      .lab-head h1 { font-size: 20px; margin: 0 0 6px; font-weight: 650; }
      .lab-head p, .lab-note { color: var(--muted); font-size: var(--fs-body, 13px);
             max-width: 68ch; line-height: 1.5; margin: 0 0 14px; }
      .lab-actions { display: inline-flex; align-items: center; gap: 6px;
             color: var(--muted); font-size: var(--fs-small, 11px); margin-bottom: 18px; }
      .lab-stage { background: var(--bg); border: 1px solid var(--edge);
             border-radius: 8px; padding: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/apps/workbench-web/src/tokenwright-lab.tsx"></script>
  </body>
</html>
