# GaugeDesk native mobile shell. This is a separate workspace because Android
# and iOS builds require Tauri's generated platform projects and mobile SDKs;
# they must not become dependencies of the server or desktop workspaces.
[package]
name = "gaugedesk-mobile"
version = "0.4.3"
edition = "2021"
authors = ["GaugeWright <support@gaugewright.com>"]
license = "AGPL-3.0-only"
description = "GaugeDesk native mobile projection client (Tauri v2)."
homepage = "https://gaugewright.com/gaugedesk"
repository = "https://github.com/GaugeWright/gaugedesk"

[workspace]

[lib]
name = "gaugedesk_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-gaugedesk-device-identity = { path = "plugins/device-identity" }
# `tauri::generate_context!()` expands through serde_json in the application
# crate, so it must be a direct dependency.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
gaugewright-relay-transport = { path = "../crates/relay-transport" }
tokio = { version = "1", features = ["rt", "net"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.5"
