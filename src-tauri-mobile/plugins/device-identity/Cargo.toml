[package]
name = "tauri-plugin-gaugedesk-device-identity"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
authors = ["GaugeWright <support@gaugewright.com>"]
license = "AGPL-3.0-only"
description = "Platform-keystore device identity for GaugeDesk mobile."
links = "tauri-plugin-gaugedesk-device-identity"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
