site_name: GaugeDesk Docs
site_description: Learn how to build, run, review, and publish agents with GaugeDesk.
site_url: https://docs.gaugewright.com/
copyright: © 2026 GaugeWright LLC

docs_dir: docs
site_dir: site

theme:
  name: material
  # The masthead is the GaugeWright signature, drawn as gaugewright.com draws it.
  # It replaces Material's default logo icon through overrides/partials/logo.html.
  custom_dir: overrides
  # Brand fonts are self-hosted from docs/assets/brand.css. Disabling Material's
  # loader avoids requesting Commit Mono from Google Fonts, where it is absent.
  font: false
  palette:
    # Navy-led by default (matches the marketing site). Light is a toggle.
    #
    # `custom` rather than a named Material primary: `black` carries its own
    # `.md-header { background-color: ... }` rule, which beat the navy declared
    # in assets/brand.css and left the header near-black while the stylesheet
    # said otherwise. With `custom`, Material emits no primary block and the
    # surfaces below take --md-primary-* from brand.css.
    - scheme: slate
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/GaugeWright/gaugedesk
repo_name: GaugeWright/gaugedesk
edit_uri: edit/main/docs/

extra_css:
  - assets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# A link to a heading that does not exist still resolves — it lands the reader
# at the top of the target page instead of the section it names, which is worse
# than a dead link because nothing looks wrong. mkdocs reports that at INFO by
# default, so `--strict` does not fail on it and one shipped unnoticed in the
# WhippleScript manual. Raised to a warning, which `--strict` escalates to an
# error, so anchor drift fails the build that introduces it.
validation:
  anchors: warn

nav:
  - Home: index.md
  - Build an agent:
      - Overview: guides/expert/index.md
      - Build your first agent: guides/expert/build-an-agent.md
      - Save and update versions: guides/expert/versioning-and-forking.md
  - Run and review:
      - Run an agent: guides/expert/run-and-review.md
      - Review work from an agent: guides/client/review-and-release.md
      - Check an agent before use: guides/client/verify-before-trust.md
  - Publish:
      - Publish on a website: guides/embed/index.md
      - Package for another team: guides/expert/package-and-deploy.md
  - Manage GaugeDesk:
      - Administration: guides/admin/index.md
      - Set up SSO and SCIM: guides/admin/identity-and-provisioning.md
      - Working with another team: guides/client/index.md
  - Troubleshooting: guides/expert/troubleshooting.md
  - Understand GaugeDesk:
      - Overview: concepts/index.md
      - How GaugeDesk protects your work: concepts/protection.md
      - Where work runs: concepts/deployment-modes.md
      - Glossary: concepts/glossary.md
  - Security and trust:
      - security.md
      - Data processing and subprocessors: trust/subprocessors.md
      - Support: trust/support.md
      - Security operations: trust/security-operations.md
      - Incident response: trust/incident-response.md
  - Reference:
      - Product status: reference/status.md
      - Current limits: reference/limitations.md
      - Verify security claims: reference/verifying-claims.md
      - FAQ: faq.md
      - Documentation license: LICENSE.md
