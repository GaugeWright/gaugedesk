# gaugewright desktop shell (Tauri v2). Its own workspace — building it needs the
# Tauri CLI + system webkit deps, so it is deliberately outside the backend
# cargo workspace (which stays self-contained and green).
[package]
name = "gaugedesk-desktop"
version = "0.4.5"
edition = "2021"
autobins = false
authors = ["GaugeWright <support@gaugewright.com>"]
license = "AGPL-3.0-only"
description = "GaugeDesk desktop workbench (Tauri v2 shell + co-resident control plane)."
homepage = "https://gaugewright.com/gaugedesk"
repository = "https://github.com/GaugeWright/gaugedesk"

[[bin]]
name = "gaugedesk"
path = "src/main.rs"

[workspace]

# Keep the packaged desktop on the same exact WhippleScript collaboration-host
# contract as the backend workspace. This nested Cargo workspace has its own
# resolver and lockfile, so the root patch does not apply here.
[patch.crates-io]
whipplescript = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "b151ba82602f276fd00e58535e0f49d9ed80e3d3" }
whipplescript-kernel = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "b151ba82602f276fd00e58535e0f49d9ed80e3d3" }
whipplescript-parser = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "b151ba82602f276fd00e58535e0f49d9ed80e3d3" }
whipplescript-store = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "b151ba82602f276fd00e58535e0f49d9ed80e3d3" }

[profile.release]
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Self-update: verifies signed update artifacts against the pubkey in
# tauri.conf.json (plugins.updater) and fetches the GitHub Release `latest.json`.
tauri-plugin-updater = "2"
# FED-7: register the `gaugewright://` URL scheme so an invite link opens the app
# directly. single-instance routes a deep link into the already-running instance on
# Linux/Windows (must be registered first); macOS delivers to the running app natively.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# LOGIN-7: open http(s) URLs in the person's default browser. The webview drops
# `window.open` silently, and ADR 0123 requires sign-in in the *system* browser
# (an embedded webview is rejected there), so the shell owns the open.
tauri-plugin-opener = "2"
gaugedesk-app = { path = "../crates/app", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
# `tauri::generate_context!()` expands to code that parses the bundled config via
# serde_json, so it must be a direct dependency (else E0433: serde_json not in crate root).
serde_json = "1"

[features]
# Production builds embed custom-protocol assets; dev uses the Vite server.
custom-protocol = ["tauri/custom-protocol"]
