# gaugewright — Rust backend workspace.
# The functional-core / imperative-shell split (ADR 0004) is the crate boundary:
# `core` is pure (reducers, no I/O), property-tested against the Quint models in
# specs/models. The shell crates materialize non-determinism around it:
# `store` (SQLite event log + admission), `workspace` (WhippleScript cuts/working sets),
# `boundary` (egress membrane + .agent-config.json policy), `harness` (the
# adapter-free runtime seam + OS sandbox), `whip-runtime` (the selected governed
# runtime), and `app` (the engine orchestrator + axum control plane).
# See specs/implementation/backend-stack.md and mvp-plan.md.
[workspace]
resolver = "2"
members = ["crates/env", "crates/core", "crates/store", "crates/workspace", "crates/boundary", "crates/harness", "crates/tracker", "crates/whip-runtime", "crates/relay-transport", "crates/directory-protocol", "crates/app", "ee/app"]
# The Tauri desktop shell is its own workspace (needs system webkit/CLI to build);
# excluded so `cargo test` over the backend stays self-contained.
# third-party/ is reindeer's input for the native third-party targets, not a crate.
exclude = ["src-tauri", "third-party"]

# How this workspace is rendered as native Buck2 targets (GaugeWright BUILD.md
# stages 5 and 6): the cell and repository it is, and the section of the bar
# whose `cargo check -p` line is its other configuration. Read by
# scripts/buckify-crates.py, which the GaugeWright repository renders here.
[workspace.metadata.native]
cell = "gaugedesk"
checkout = "gaugedesk-src"
feature-checks = "no-default-features"
doctests = true
# The Tauri shells are workspaces of their own that take crates from this one by
# path; their sections are keyed on what cargo reads of it for each.
dependents = ["src-tauri", "src-tauri-mobile"]
wasm = [{ package = "gaugedesk-relay-transport" }, { package = "gaugedesk-directory-protocol", features = ["wasm"] }]

[workspace.package]
edition = "2021"
version = "0.9.1"
# The platform default (ADR 0121 / company DR-0056).
license = "AGPL-3.0-only"

# Dependencies are built without debug info. They dominate target/debug/deps,
# and debug info measured ~78% of binary size (whipplescript, 2026-07-25).
# Local crates keep full debuggability: panics and the debugger still work here.
# The pure-Rust crypto the product signs and verifies with, and the two C
# libraries every store and every TLS handshake go through, optimized even in
# a development build. Unoptimized, P-256 and its big-integer arithmetic were a
# third of a file-action test and SQLite compiled at -O0 sat under every store
# read; these crates change rarely, compile once per worktree, and are never
# what a debugger is pointed at. Workspace crates stay unoptimized.
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.rfc6979]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 2
[profile.dev.package.ring]
opt-level = 2

[profile.dev.package."*"]
debug = false

# Every integration-test binary links the app's large type graph. Keep line
# information for test backtraces without repeating its full type/variable
# debug records in every binary; ordinary development builds keep full debug.
[profile.test]
debug = "line-tables-only"

# MTARGET-1: GaugeDesk consumes the exact public projection of the landed
# WhippleScript workstream-host contract. The contract checker below binds this
# source revision to the published contract revision and digest; no project
# workstream feature may compile against the older crates.io release.
[patch.crates-io]
whipplescript = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "7ffaea8f170c020a0fc628bfc7c30f7dc40c7f0c" }
whipplescript-core = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "7ffaea8f170c020a0fc628bfc7c30f7dc40c7f0c" }
whipplescript-kernel = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "7ffaea8f170c020a0fc628bfc7c30f7dc40c7f0c" }
whipplescript-parser = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "7ffaea8f170c020a0fc628bfc7c30f7dc40c7f0c" }
whipplescript-store = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "7ffaea8f170c020a0fc628bfc7c30f7dc40c7f0c" }
