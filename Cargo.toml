# gaugewright — Rust backend workspace.
# The functional-core / imperative-shell split (ADR 0004) is the crate boundary:
# `core` is pure (reducers, no I/O), property-tested against the Quint models in
# specs/models. The shell crates materialize non-determinism around it:
# `store` (SQLite event log + admission), `workspace` (WhippleScript cuts/working sets),
# `boundary` (egress membrane + .agent-config.json policy), `harness` (the
# adapter-free runtime seam + OS sandbox), `whip-runtime` (the selected governed
# runtime), `pi-bridge` (retired protocol/conformance corpus), and `app` (the
# engine orchestrator + axum control plane).
# See specs/implementation/backend-stack.md and mvp-plan.md.
[workspace]
resolver = "2"
members = ["crates/env", "crates/core", "crates/store", "crates/workspace", "crates/boundary", "crates/harness", "crates/pi-bridge", "crates/tracker", "crates/whip-runtime", "crates/relay-transport", "crates/directory-protocol", "crates/app", "ee/app"]
# The Tauri desktop shell is its own workspace (needs system webkit/CLI to build);
# excluded so `cargo test` over the backend stays self-contained.
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
version = "0.4.5"
# The platform default (ADR 0121 / company DR-0056).
license = "AGPL-3.0-only"

# Dependencies are built without debug info. They dominate target/debug/deps,
# and debug info measured ~78% of binary size (whipplescript, 2026-07-25).
# Local crates keep full debuggability: panics and the debugger still work here.
[profile.dev.package."*"]
debug = false

# MTARGET-1: GaugeDesk consumes the exact public projection of the landed
# WhippleScript workstream-host contract. The contract checker below binds this
# source revision to the published contract revision and digest; no project
# workstream feature may compile against the older crates.io release.
[patch.crates-io]
whipplescript = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "bd82c773c88f5447efc8c3e8c2a8d5a82fdb5444" }
whipplescript-kernel = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "bd82c773c88f5447efc8c3e8c2a8d5a82fdb5444" }
whipplescript-parser = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "bd82c773c88f5447efc8c3e8c2a8d5a82fdb5444" }
whipplescript-store = { git = "https://github.com/GaugeWright/whipplescript.git", rev = "bd82c773c88f5447efc8c3e8c2a8d5a82fdb5444" }
