[package]
name = "gaugedesk-store"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "gaugewright local store: SQLite event log + records + the admission transaction (imperative shell)."

[dependencies]
gaugedesk-env = { path = "../env" }
gaugedesk-core = { path = "../core" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = "1"
serde_json = "1"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
ring = "0.17"
tempfile = "3"
