[package]
name = "gaugedesk-relay-transport"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Blind role-aware rendezvous and cert-pinned Home/client tunnel."

# No `crate-type` here, deliberately. The browser's module is a cdylib, and
# scripts/build-wasm.sh asks for one where it is wanted, with `cargo rustc
# --crate-type cdylib`. Declared here, it made cargo drop the hash from every
# native build of this crate, so each feature graph — `cargo build` against
# `cargo test`'s `test-relay` — overwrote the same rlib and rebuilt everything
# above it (DR-0234, DESK-9).

[features]
test-relay = []

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The native carrier: sockets, the filesystem, and the tungstenite client. A
# wasm32 build links none of this.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gaugedesk-env = { path = "../env" }
# Each relay stage — a Home leg dialled, parked, paired, a crossing's TLS — is
# logged with its elapsed time, so an installed app's log says where a slow
# reach went. The desktop shell writes `tracing` to its log file; stderr, which
# an installed app discards, was where these used to go.
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
getrandom = "0.2"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# One tunnel carrying many streams, for a client that opens many connections
# to one Home — the phone's WebView (`mux`). `compat` bridges yamux's futures
# I/O traits to tokio's.
yamux = "0.13"
tokio-util = { version = "0.7", features = ["compat"] }

# The browser carrier. `ring` is the *same* provider the native carrier uses —
# its `wasm32_unknown_unknown_js` feature routes entropy to
# `crypto.getRandomValues`, so the browser introduces no new crypto trust
# surface (ADR 0130 §4). Building it needs clang for the wasm32 target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "ErrorEvent", "MessageEvent", "WebSocket", "Window", "Response", "Request", "RequestInit"] }

[dev-dependencies]
tempfile = "3"
# `test-util` gives the teardown-grace test a paused clock, so proving the bound
# exists costs no wall time. Dev-only: a paused clock must never reach a build
# that ships.
tokio = { version = "1", features = ["test-util"] }

# The integration tests drive a real relay, which lives behind `test-relay` so it
# never ships. A self dev-dependency turns the feature on for this crate's own
# tests without an explicit `--features` on every invocation — so the ordinary
# workspace gate covers the relay splice rather than skipping past it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gaugedesk-relay-transport = { path = ".", features = ["test-relay"] }

[[example]]
name = "test-wss-relay"
required-features = ["test-relay"]

# The hermetic end of the browser lane (DESK-7): a relay, a parked Home leg, and
# a config endpoint the browser test reads because the relay port is ephemeral.
[[example]]
name = "hermetic-home"
required-features = ["test-relay"]

# The browser half is proven by running it in a browser, not by trusting
# that a successful wasm32 compile implies a working ring at runtime (DESK-6).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
