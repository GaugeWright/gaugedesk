[package]
name = "gaugedesk-harness"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "gaugewright runtime seam: the adapter-free Harness contract, egress gate, neutral turn/content types, and the OS sandbox."

[lib]
# It has no doctests. Natively a doctest run links the library as a staticlib of
# everything it depends on; scripts/check-doctest-opt-outs.py holds this to the
# sources, in both directions.
doctest = false

[dependencies]
gaugedesk-env = { path = "../env" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
# Async local TCP for the host-filtering egress proxy (CORE-5). Reuses the
# workspace's existing tokio (the `app` crate already pins 1.x, so no new external
# dependency enters the lock); only the net/io/rt features the proxy needs.
tokio = { version = "1", features = ["rt", "net", "io-util", "macros"] }

[dev-dependencies]
tempfile = "3"
