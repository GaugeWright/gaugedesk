[package]
name = "gaugedesk-whip-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# It has no doctests. Natively a doctest run links the library as a staticlib of
# everything it depends on; scripts/check-doctest-opt-outs.py holds this to the
# sources, in both directions.
doctest = false

[dependencies]
gaugedesk-core = { path = "../core" }
gaugedesk-harness = { path = "../harness" }
base64 = "0.23"
hex = "0.4"
libc = "0.2"
sha2 = "0.11"
serde = "1"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
url = "2"
whipplescript = { version = "0.9.0", default-features = false }
# Compiling a governed program is part of admitting it. The CLI enforces
# information flow at run time as well as check time (DR-0027 I-IFC6/E3), and a
# host embedding WhippleScript needs the same before it executes anything.
whipplescript-parser = { version = "0.9.0" }
# The host-integration surface. `whipplescript-host-do` — WhippleScript's own
# second host — drives workflows through exactly these APIs, so GaugeDesk
# running a project's gate is a third host on the same path rather than a bypass
# of the CLI crate's narrower re-export list.
whipplescript-kernel = { version = "0.9.0" }
whipplescript-store = { version = "0.9.0" }

[dev-dependencies]
ring = "0.17"
tempfile = "3"
