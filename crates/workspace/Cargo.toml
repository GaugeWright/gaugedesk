[package]
name = "gaugedesk-workspace"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.native-tests]
# What this crate's tests read at run time beyond the crate and what its
# sources name by relative path, for the native test runs (GaugeWright BUILD.md
# stages 5 and 6). action_source_inventory runs `cargo metadata` over the whole
# workspace, scans the app's sources, and compares what it finds with the
# committed inventory; action_evidence_writers does the same against the
# command/effect evidence boundary. A run's mount holds only declared files, so a missing
# entry fails the test instead of caching a pass it never earned.
data = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "contracts/workspace-action-sites.json", "contracts/action-evidence-writers.json", "crates", "ee/app"]

[lib]
# It has no doctests. Natively a doctest run links the library as a staticlib of
# everything it depends on; scripts/check-doctest-opt-outs.py holds this to the
# sources, in both directions.
doctest = false

[dependencies]
# The versioned-workspace substrate AND the merge engine (SUB-6
# convergence port, 2026-07-11): whip's WorkspaceVcs over its native
# sqlite stores — branches/cuts/merge/restore/text-merge all upstream; this
# crate only adapts worktrees-on-disk and lifecycle policy. The immutable rev
# is the public v0.4 projection used by the public GaugeDesk CI path.
whipplescript-store = { version = "0.9.0", features = ["native"] }
# MTARGET-6: reuse the generic promotion/cleanup door, not a product-owned
# copy of its cross-store recovery protocol. The native store above owns the
# native feature; this edge introduces no provider or product-layer dependency.
whipplescript-kernel = { version = "0.9.0", default-features = false }
# Store-file snapshots (VACUUM INTO) for export/fork, and the read-only
# peek at pre-vcs legacy stores during migration. Same version whip's
# native feature bundles, so cargo unifies them.
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
# ACTION-1 parses production items without truncating files at inline test modules.
syn = { version = "=2.0.119", features = ["full", "visit"] }
quote = "1"
