[package]
name = "gaugedesk-boundary"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# It has no doctests. Natively a doctest run links the library as a staticlib of
# everything it depends on; scripts/check-doctest-opt-outs.py holds this to the
# sources, in both directions.
doctest = false

[dependencies]
gaugedesk-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
