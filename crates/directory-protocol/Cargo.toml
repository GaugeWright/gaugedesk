[package]
name = "gaugedesk-directory-protocol"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Canonical Wasm-compatible wire and signing contract for the blind account directory."

# No `crate-type` here, deliberately. The verifier module is a cdylib, and its
# two builds — scripts/build-wasm.sh here and gaugewright-cloud's directory
# Worker — ask for one with `cargo rustc --crate-type cdylib`. Declared here, it
# made cargo drop the hash from every native build of this crate, so a `cargo
# build` and a `cargo test` overwrote each other's rlib and rebuilt everything
# above it (DR-0234, DESK-9).

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
gaugedesk-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"
