# gaugedesk-ee — GaugeDesk Administration capabilities.
# Owns the enterprise admin/SSO/SCIM control-plane surface extracted from
# `crates/app`: the org admin routes + ENTSEC-1 data-route auth middleware
# (`org_routes`), the OIDC auth-code + PKCE login shell and startup SSO
# activation (`auth_oidc`), the OIDC id-token verifier core (`identity_oidc`),
# the SAML sidecar adapter (`identity_saml`), and SCIM provisioning
# (`scim_routes`). The subtree is a capability boundary inside the AGPL platform
# (ADR 0121), not a separate source-license band. The
# substrate it composes over (org/audit/workbench_auth/identity records,
# traits, and Workbench accessors) stays in `crates/app`.
[package]
name = "gaugedesk-ee"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "GaugeDesk Administration capabilities: org admin, SSO (OIDC/SAML), SCIM, and enterprise data-route auth over the AGPL platform."

[dependencies]
gaugedesk-env = { path = "../../crates/env" }
gaugedesk-core = { path = "../../crates/core" }
gaugedesk-store = { path = "../../crates/store" }
gaugedesk-app = { path = "../../crates/app", default-features = false }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
sha2 = "0.11"
hex = "0.4"
# OIDC SSO adapter (M3 ID-3): id-token (JWT) verification behind the
# `IdentityProvider` seam. `ring` is the crypto backend (already in the tree via
# tokio-rustls), keeping the build OpenSSL- and cmake-free to match the app's
# `crypto_nossl` choice. `use_pem` gives RS256/ES256 key loading from PEM.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
# base64 for the enterprise OIDC auth-code state/claims decoding (ID-3).
base64 = "0.23"

[dev-dependencies]
gaugedesk-workspace = { path = "../../crates/workspace" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
