name: Install apt packages, bounded
description: >-
  Install Debian packages with a per-attempt time bound and retries, so a mirror
  that stalls costs a retry rather than the whole job.

inputs:
  packages:
    description: Space-separated package names.
    required: true
  attempt-timeout:
    description: >-
      Seconds one update+install attempt may take before it is killed and
      retried. The default clears the slowest healthy run observed on these
      runners with margin to spare.
    required: false
    default: "480"
  attempts:
    description: How many bounded attempts before giving up.
    required: false
    default: "3"

runs:
  using: composite
  steps:
    # The logic lives in `apt-install.sh` beside this file so that
    # `scripts/apt-install-action.test.sh` can exercise it against stub
    # commands; a bound and a retry that no test reaches are a bound and a
    # retry that can stop working silently.
    - name: Install ${{ inputs.packages }}
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_ATTEMPT_TIMEOUT: ${{ inputs.attempt-timeout }}
        APT_ATTEMPTS: ${{ inputs.attempts }}
      run: bash "$GITHUB_ACTION_PATH/apt-install.sh"
