# Build and deploy the user documentation (docs/ → docs.gaugewright.com).
# Runs only when the docs change; gates on `mkdocs build --strict` (broken
# links/nav fail), then deploys to the Cloudflare Pages project `gaugewright-docs`.
#
# Requires one repo secret and one ordinary repo variable
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — scoped token with Account › Cloudflare Pages › Edit
#   CLOUDFLARE_ACCOUNT_ID  — public account identifier (repo variable)
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # The theme's custom_dir. A masthead change touches only this, and without
      # it here that change would never reach the deployed site.
      - 'overrides/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build (strict — broken links/nav fail the build)
        run: mkdocs build --strict
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=gaugewright-docs --branch=main
