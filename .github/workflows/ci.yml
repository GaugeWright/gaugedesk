# Public CI for the gaugedesk open-source mirror. Published AS ci.yml by
# scripts/publish-public-mirror.sh. It runs only the lanes that need nothing but
# public source: Rust fmt/clippy/test and the web/ee typecheck+build+unit tests.
# The private repo's ci.yml additionally runs the Quint model checks, the
# spec-audit tracker gate, and coverage — all of which need the private specs/.
name: ci (public mirror)

on:
  push:
  pull_request:

concurrency:
  group: ci-public-${{ github.ref }}
  # Superseded runs on a branch are wasted minutes, so they still cancel.
  # Trunk is different: when a burst of merges cancels a run, the run is
  # recorded as `failure` with no failing job, and that red never meant
  # anything. A trunk verdict you have to click through to trust is worth
  # less than the minutes cancelling it saves.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    if: ${{ github.event.repository.private == false }}
    name: rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup materializes the toolchain named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh rust

  architecture:
    if: ${{ github.event.repository.private == false }}
    name: architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: enforce crate and transport boundaries
        run: python3 scripts/architecture-check.py
      - name: enforce license boundary
        run: python3 scripts/check-license-boundary.py

  web:
    if: ${{ github.event.repository.private == false }}
    name: web (typecheck · vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            ee/web/package-lock.json
      # The web builds bundle the browser tunnel (DESK-7, ADR 0130), which is
      # generated from `crates/relay-transport` rather than committed. This
      # runner is fresh every time, so `check.sh web` builds it here — and that
      # needs the wasm32 toolchain. `ring` compiles C for wasm32, hence clang;
      # `build-wasm.sh` finishes with wasm-opt, hence binaryen. The same
      # set the private repo's browser-tunnel job installs.
      - name: Install Rust for the wasm32 target
        working-directory: .
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Install clang and binaryen for the wasm32 target
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y clang llvm binaryen
      - uses: Swatinem/rust-cache@v2
      - name: Install the matching wasm-bindgen CLI
        working-directory: .
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: scripts/check.sh web
        working-directory: .
