# The lanes that need nothing but public source: Rust fmt/clippy/test and the
# web/ee typecheck+build+unit tests. Published AS ci.yml to the open-source
# mirror by scripts/publish-public-mirror.sh.
#
# This file and the private repo's own ci.yml are two halves of one green bar,
# not an inner and an outer one. `scripts/check.sh` has three sections: ci.yml
# runs `contracts`, and the two jobs below run `rust` and `web`. Neither file is
# a superset of the other, so reading one tells you nothing about what the other
# gates. This header used to claim ci.yml "additionally" ran the Quint models,
# the spec audit, and coverage; only the spec audit is in it — the models are
# their own path-triggered gate in formal-models.yml, and ci.yml's coverage job
# runs on a schedule or a dispatch, never on a pull request.
#
# `rust` and `web` run in BOTH repositories, for two different reasons, and the
# repository decides only which runner pays.
#
# On `-src` they are the gate. They belong where the pull requests are. Every
# job here was previously conditioned on `github.event.repository.private ==
# false`, which reads like "let the free runners do it" but means "do not run
# here at all": both lanes reported `skipped` on every pull request, so a change
# to web/ or a Cargo.toml bump merged without being typechecked or compiled by
# anything. The mirror ran them afterwards, on trunk, where `mirror/ci` is
# advisory — a report nobody is blocked by. That is how an embed reconnect fix
# (#232) landed with a unit test no gate had executed, and it is why a lane can
# sit red for a day unnoticed: the web lane broke on 2026-08-11 and every run
# since failed on binaryen 108, so for that whole window nothing typechecked
# this tree in either repository.
#
# Running was only half of it. Both were left out of `main`'s required-check
# list under the rule that a permanently skipped check must not be required —
# correct while they were skipped, stale the moment they were not, and for a day
# they ran and passed while a red one would still have merged. `rust (fmt ·
# clippy · test)` and `web (typecheck · vitest)` are now required contexts on
# `-src`. A required check is matched by the job's `name:`, so editing either
# name here silently drops its requirement: change the name and the protection
# together (DR-0069 `OPS-1`, `OPS-18`).
#
# On the mirror they are the check on the published projection.
# `publish-public-mirror.sh` builds a curated tree, and this is the only place
# that compiles and tests that tree as a whole, so `mirror-verdict.yml` has
# something real to carry back to trunk. A private pass cannot stand in for it:
# it proves the private tree builds, not that the projection is self-contained.
#
# Both repositories run on GitHub-hosted runners: the mirror because Actions
# is free for a public repository, `-src` because the Enterprise plan's
# included allowance covers the private gate, so `runs-on` no longer needs to
# resolve per repository. This is the shape whipplescript already uses, for
# the same reasons.
name: ci (public mirror)

on:
  # A pull request branch would otherwise run this twice — once for `push` and
  # once for `pull_request`, under different concurrency groups. The mirror only
  # ever receives pushes to main from the sync.
  push:
    branches: [main]
  pull_request:

permissions:
  # Read-only by default; a job that needs more declares it.
  contents: read

concurrency:
  group: ci-public-${{ github.ref }}
  # Superseded runs on a branch are wasted minutes, so they still cancel.
  # Trunk is different: when a burst of merges cancels a run, the run is
  # recorded as `failure` with no failing job, and that red never meant
  # anything. A trunk verdict you have to click through to trust is worth
  # less than the minutes cancelling it saves.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rustup materializes the toolchain named in rust-toolchain.toml.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/check.sh rust

  # Mirror-only, and deliberately unlike the two lanes around it: on `-src`
  # these same two scripts already run inside `scripts/check.sh contracts`,
  # which gates every pull request there. The mirror has no contracts job, so
  # without this the projection would carry no boundary check at all.
  architecture:
    if: ${{ github.event.repository.private == false }}
    name: architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: enforce crate and transport boundaries
        run: python3 scripts/architecture-check.py
      - name: enforce license boundary
        run: python3 scripts/check-license-boundary.py

  web:
    name: web (typecheck · vitest)
    runs-on: ubuntu-latest
    # The wasm toolchain below installs from apt, a binaryen release, crates.io,
    # and npm, and any of them can hang rather than fail — the browser-tunnel
    # job in ci.yml lost a runner to a fifty-minute `apt-get install` once. This
    # is slack, not a deadline.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            ee/web/package-lock.json
      # The web builds bundle the browser tunnel (DESK-7, ADR 0130), which is
      # generated from `crates/relay-transport` rather than committed. This
      # runner is fresh every time, so `check.sh web` builds it here — and that
      # needs the wasm32 toolchain. `ring` compiles C for wasm32, hence clang;
      # `build-wasm.sh` finishes with wasm-opt, hence binaryen. The same
      # set the private repo's browser-tunnel job installs.
      - name: Install Rust for the wasm32 target
        working-directory: .
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Install clang for the wasm32 target
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      # Binaryen comes from its own releases at a pinned version, not from the
      # distribution, exactly as ci.yml's browser-tunnel job takes it. apt ships
      # 108 on both runners, and `build-wasm.sh` refuses anything below 120
      # because `wasm-opt -Oz` there emits a module whose function table cannot
      # grow — which wasm-bindgen's glue needs, so it dies at instantiation with
      # `failed to grow table by 4`. Taking apt's is what broke this lane on
      # 2026-08-11 and kept it red every run after.
      - name: Install binaryen
        working-directory: .
        env:
          BINARYEN_VERSION: version_131
        run: |
          set -euo pipefail
          # The release CDN answers 503 often enough to redden this lane on a
          # tree that is fine, and a bare `curl -f` turns that into a job
          # failure indistinguishable from a real one. Retry the download the
          # way apt-publish.yml already does.
          #
          # `--retry 6` alone was not enough: its exponential backoff spends
          # about a minute, and an outage on 2026-08-12 ran longer than that and
          # failed two lanes on trees that were fine. A fixed 10 s delay bounded
          # by ten minutes rides out a wobble of that length without turning a
          # genuinely missing artifact into a ten-minute hang.
          curl -fsSL --retry 12 --retry-delay 10 --retry-max-time 600 \
            --retry-all-errors -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          sudo tar -xzf /tmp/binaryen.tar.gz -C /usr/local --strip-components=1
          wasm-opt --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the matching wasm-bindgen CLI
        working-directory: .
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: scripts/check.sh web
        working-directory: .
